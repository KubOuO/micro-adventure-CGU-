<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#22243a">
  <meta name="description" content="以勤勞樸實為精神，從永慶爺爺銅像、好漢坡、木棧道到校園補給點，抽一個長庚大學探索任務。">
  <title>長庚校園微冒險｜新生與訪客探索任務</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #22243a;
      --panel: #2d3048;
      --panel-soft: #373a53;
      --ink: #f4f2e8;
      --muted: #b9bbca;
      --lime: #d9f06a;
      --coral: #ff8a72;
      --line: rgba(244, 242, 232, .15);
      --sans: "Aptos", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--night);
      font-family: var(--sans);
      line-height: 1.55;
    }
    button, select { font: inherit; }
    button { color: inherit; }
    .page { width: min(1180px, calc(100% - 48px)); margin: 0 auto; padding: 30px 0 46px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; font-weight: 750; letter-spacing: .02em; }
    .brand-mark { position: relative; width: 28px; height: 28px; border: 2px solid var(--lime); border-radius: 50% 50% 50% 5px; transform: rotate(-45deg); }
    .brand-mark::after { position: absolute; content: ""; width: 7px; height: 7px; background: var(--lime); border-radius: 50%; top: 8px; left: 8px; }
    .top-note { color: var(--muted); font-size: .86rem; }
    .intro { display: grid; grid-template-columns: 1fr 340px; gap: 36px; align-items: end; padding: 45px 0 31px; }
    h1 { max-width: 720px; margin: 0; font-size: clamp(2.25rem, 5vw, 4.35rem); line-height: 1.12; letter-spacing: -.045em; font-weight: 760; }
    .intro p { margin: 16px 0 0; color: var(--muted); font-size: 1.02rem; }
    .intro-aside { display: flex; align-items: center; gap: 13px; padding: 15px 17px; color: var(--muted); background: var(--panel); border-radius: 14px; font-size: .9rem; }
    .sun { flex: 0 0 auto; width: 34px; height: 34px; border: 2px solid var(--coral); border-radius: 50%; box-shadow: 0 0 0 6px rgba(255,138,114,.12); }
    .workspace { display: grid; grid-template-columns: minmax(275px, 355px) 1fr; gap: 22px; align-items: start; }
    .controls, .result-wrap { border-radius: 20px; }
    .controls { padding: 23px; background: var(--panel); }
    .section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 21px; font-size: 1.12rem; }
    .section-title small { color: var(--muted); font-size: .78rem; font-weight: 500; }
    fieldset { min-width: 0; margin: 0 0 21px; padding: 0; border: 0; }
    legend { margin-bottom: 10px; color: var(--muted); font-size: .86rem; }
    .choice-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .choice input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .choice span { display: grid; min-height: 44px; place-items: center; padding: 7px 8px; color: var(--ink); background: var(--panel-soft); border: 1px solid transparent; border-radius: 10px; cursor: pointer; font-size: .88rem; text-align: center; transition: background .16s ease, border-color .16s ease, color .16s ease; }
    .choice input:checked + span { color: var(--night); background: var(--lime); border-color: var(--lime); font-weight: 720; }
    .choice input:focus-visible + span { outline: 3px solid var(--coral); outline-offset: 3px; }
    .draw-button { display: flex; width: 100%; min-height: 52px; align-items: center; justify-content: center; gap: 10px; margin-top: 4px; color: var(--night); background: var(--lime); border: 0; border-radius: 12px; cursor: pointer; font-weight: 760; transition: transform .16s ease, filter .16s ease; }
    .draw-button:hover { filter: brightness(1.06); transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
    .draw-icon { font-size: 1.25rem; line-height: 1; }
    .result-wrap { min-height: 442px; padding: 17px; background: var(--panel-soft); }
    .ticket { position: relative; display: flex; min-height: 408px; flex-direction: column; overflow: hidden; padding: clamp(24px, 4vw, 43px); color: var(--night); background: var(--ink); border-radius: 15px; }
    .ticket::before, .ticket::after { position: absolute; top: 63%; width: 28px; height: 28px; content: ""; background: var(--panel-soft); border-radius: 50%; }
    .ticket::before { left: -14px; }
    .ticket::after { right: -14px; }
    .ticket-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 18px; border-bottom: 1px dashed rgba(34,36,58,.3); }
    .ticket-label { color: #656779; font-size: .78rem; letter-spacing: .07em; }
    .ticket-meta { display: flex; gap: 8px; }
    .pill { padding: 5px 10px; color: var(--night); background: #e6e7d8; border-radius: 999px; font-size: .78rem; font-weight: 650; }
    .ticket-content { display: flex; flex: 1; flex-direction: column; justify-content: center; padding: 23px 0; }
    .ticket-kicker { margin: 0 0 8px; color: #77798a; font-size: .88rem; }
    .activity-title { margin: 0; font-size: clamp(2rem, 4.4vw, 3.4rem); line-height: 1.17; letter-spacing: -.04em; }
    .activity-desc { max-width: 520px; margin: 15px 0 0; color: #525466; font-size: 1rem; }
    .start-hint { display: flex; gap: 10px; align-items: flex-start; margin-top: 23px; padding: 13px 15px; background: #e8eadb; border-radius: 10px; color: #424457; font-size: .9rem; }
    .start-hint b { color: #5a6817; white-space: nowrap; }
    .ticket-bottom { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding-top: 15px; border-top: 1px dashed rgba(34,36,58,.3); }
    .ticket-id { color: #77798a; font-size: .78rem; }
    .result-actions { display: flex; gap: 8px; }
    .soft-button { min-height: 39px; padding: 7px 13px; color: var(--night); background: transparent; border: 1px solid rgba(34,36,58,.25); border-radius: 9px; cursor: pointer; font-size: .85rem; font-weight: 650; }
    .soft-button:hover { background: rgba(34,36,58,.07); }
    .soft-button.primary { background: var(--night); color: var(--ink); border-color: var(--night); }
    .empty-state { display: flex; flex: 1; flex-direction: column; justify-content: center; align-items: flex-start; }
    .empty-orbit { display: grid; width: 72px; height: 72px; place-items: center; margin-bottom: 20px; color: var(--night); background: var(--lime); border-radius: 50%; font-size: 2rem; }
    .empty-state h2 { margin: 0; font-size: clamp(1.6rem, 3vw, 2.4rem); line-height: 1.2; }
    .empty-state p { max-width: 400px; margin: 10px 0 0; color: #626477; }
    .status { min-height: 1.5em; margin: 10px 3px 0; color: var(--muted); font-size: .83rem; }
    .saved { margin-top: 23px; padding-top: 19px; border-top: 1px solid var(--line); }
    .saved-heading { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
    .saved-heading h2 { margin: 0; font-size: .95rem; }
    .saved-count { color: var(--muted); font-size: .78rem; }
    .saved-list { display: grid; gap: 7px; }
    .saved-empty { margin: 0; color: var(--muted); font-size: .82rem; }
    .saved-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; color: var(--ink); background: rgba(255,255,255,.045); border-radius: 8px; font-size: .84rem; }
    .saved-item button { flex: 0 0 auto; padding: 3px 5px; color: var(--muted); background: none; border: 0; cursor: pointer; font-size: .78rem; text-decoration: underline; text-underline-offset: 3px; }
    footer { display: flex; justify-content: space-between; gap: 16px; margin-top: 21px; color: var(--muted); font-size: .8rem; }
    [hidden] { display: none !important; }
    @media (max-width: 760px) {
      .page { width: min(100% - 30px, 600px); padding-top: 20px; }
      .intro { grid-template-columns: 1fr; gap: 20px; padding: 34px 0 23px; }
      .intro-aside { max-width: 390px; }
      .workspace { grid-template-columns: 1fr; gap: 14px; }
      .controls { padding: 19px; }
      .result-wrap { min-height: 380px; padding: 11px; }
      .ticket { min-height: 356px; padding: 23px; }
      .ticket::before, .ticket::after { top: 64%; }
    }
    @media (max-width: 420px) {
      .page { width: calc(100% - 24px); }
      .top-note { max-width: 145px; text-align: right; font-size: .76rem; }
      .ticket-top { align-items: flex-start; flex-direction: column; gap: 9px; }
      .ticket-bottom { align-items: flex-start; flex-direction: column; }
      .ticket-id { display: none; }
      .result-actions { width: 100%; }
      .result-actions button { flex: 1; }
      footer { flex-direction: column; gap: 4px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="#top" aria-label="長庚校園微冒險首頁"><span class="brand-mark" aria-hidden="true"></span><span>長庚校園微冒險</span></a>
      <span class="top-note">勤勞樸實・走出自己的長庚日常</span>
    </header>

    <main id="top">
      <section class="intro" aria-labelledby="page-title">
        <div>
          <h1 id="page-title">從好漢坡到小木屋，<br>抽一條長庚任務。</h1>
          <p>帶著「勤勞樸實」的精神，認識地標、走走校園路線，找到自己的長庚日常。</p>
        </div>
        <aside class="intro-aside"><span class="sun" aria-hidden="true"></span><span>永慶爺爺、木棧道、醫學大樓⋯⋯<br>挑一個任務，把校園走熟一點。</span></aside>
      </section>

      <section class="workspace" aria-label="挑選長庚校園小活動">
        <aside class="controls">
          <h2 class="section-title">先選今天的狀態 <small>約 10 秒</small></h2>
          <fieldset>
            <legend>你有多少空檔？</legend>
            <div class="choice-row">
              <label class="choice"><input type="radio" name="time" value="20" checked><span>20 分鐘</span></label>
              <label class="choice"><input type="radio" name="time" value="40"><span>40 分鐘</span></label>
              <label class="choice"><input type="radio" name="time" value="60"><span>60 分鐘</span></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>現在比較像哪種心情？</legend>
            <div class="choice-row">
              <label class="choice"><input type="radio" name="mood" value="quiet" checked><span>想安靜</span></label>
              <label class="choice"><input type="radio" name="mood" value="move"><span>想活動</span></label>
              <label class="choice"><input type="radio" name="mood" value="curious"><span>想探索</span></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>想待在什麼地方？</legend>
            <div class="choice-row">
              <label class="choice"><input type="radio" name="place" value="outdoor" checked><span>戶外</span></label>
              <label class="choice"><input type="radio" name="place" value="indoor"><span>室內</span></label>
              <label class="choice"><input type="radio" name="place" value="any"><span>都可以</span></label>
            </div>
          </fieldset>
          <button class="draw-button" id="draw" type="button"><span class="draw-icon" aria-hidden="true">✳</span>幫我抽一個</button>
          <p class="status" id="status" role="status" aria-live="polite"></p>
          <section class="saved" aria-labelledby="saved-title">
            <div class="saved-heading"><h2 id="saved-title">口袋清單</h2><span class="saved-count" id="saved-count">0 個收藏</span></div>
            <div class="saved-list" id="saved-list"></div>
          </section>
        </aside>

        <section class="result-wrap" aria-label="抽選結果">
          <article class="ticket" id="ticket" aria-live="polite">
            <div class="empty-state" id="empty-state">
              <div class="empty-orbit" aria-hidden="true">↗</div>
              <h2>留一點時間，<br>讓今天拐個彎。</h2>
              <p>選好條件，抽一個認識長庚地標、路線或生活補給點的小任務。</p>
            </div>
            <div id="activity" hidden>
              <div class="ticket-top">
                <span class="ticket-label">你的長庚校園微冒險</span>
                <span class="ticket-meta"><span class="pill" id="activity-time"></span><span class="pill" id="activity-place"></span></span>
              </div>
              <div class="ticket-content">
                <p class="ticket-kicker" id="activity-mood"></p>
                <h2 class="activity-title" id="activity-title"></h2>
                <p class="activity-desc" id="activity-desc"></p>
                <div class="start-hint"><b>現在開始</b><span id="activity-hint"></span></div>
              </div>
              <div class="ticket-bottom">
                <span class="ticket-id">小小出走，不必走遠</span>
                <div class="result-actions">
                  <button class="soft-button" id="copy" type="button">複製點子</button>
                  <button class="soft-button" id="save" type="button">♡ 收藏</button>
                  <button class="soft-button primary" id="reroll" type="button">再抽一個</button>
                </div>
              </div>
            </div>
          </article>
        </section>
      </section>
    </main>
    <footer><span>所有點子都不需預約，也不用特別準備。</span><span>收藏只會保存在這個瀏覽器裡。</span></footer>
  </div>

  <script>
    "use strict";
    const ideas = [
      { id: "grandpa-statue", title: "和永慶爺爺銅像合張照", kind: "地標打卡", minutes: 20, moods: ["curious", "quiet"], place: "outdoor", desc: "找到永慶爺爺銅像，拍一張最能代表「我來長庚了」的照片。", hint: "試一個有創意但尊重地標的合照姿勢。" },
      { id: "hero-slope", title: "挑戰好漢坡，慢慢走也算過關", kind: "好漢坡挑戰", minutes: 20, moods: ["move"], place: "outdoor", desc: "走一趟大家熟悉的好漢坡，依自己的步調上坡，不必比快。", hint: "穿好走的鞋；覺得累就休息，安全比速度重要。" },
      { id: "woodwalk", title: "走一趟木棧道感官散步", kind: "路線探索", minutes: 20, moods: ["quiet", "move"], place: "outdoor", desc: "沿木棧道走一段，找出三種聲音、顏色或光影變化。", hint: "放慢腳步，留意木棧道沿途的小細節。" },
      { id: "four-buildings", title: "認識長庚四大校舍分區", kind: "新生認路", minutes: 40, moods: ["curious", "move"], place: "any", desc: "試著在校園指標或地圖上找到第一醫學大樓、第二醫學大樓、管院和工院。", hint: "從你所在的位置開始，記住下一堂課或參訪集合點怎麼走。" },
      { id: "medical-towers", title: "分清第一、第二醫學大樓", kind: "認路快問快答", minutes: 40, moods: ["curious"], place: "outdoor", desc: "沿著公共指標找出第一醫學大樓與第二醫學大樓，看看自己能不能不看地圖也認對。", hint: "留意建築入口標示；不進入管制或上課中的空間。" },
      { id: "management-engineering", title: "從管院找到工院", kind: "校園導航", minutes: 40, moods: ["curious", "move"], place: "outdoor", desc: "以管院和工院為兩個定位點，跟著校園指標完成一段認路練習。", hint: "出發前先看校園地圖，沿開放步道行走。" },
      { id: "gym-scout", title: "找到崇益德健身房", kind: "場館探索", minutes: 20, moods: ["curious", "quiet"], place: "any", desc: "認識崇益德健身房的位置與使用資訊，看看它是否符合你的運動計畫。", hint: "先確認開放時間與使用資格；不符合資格就停在公共區域看指引。" },
      { id: "wente-meal", title: "在文園自助餐選一道今日代表菜", kind: "學餐探索", minutes: 40, moods: ["curious", "quiet"], place: "indoor", desc: "看看文園自助餐今天有哪些選擇，挑一道最想推薦給新生的菜。", hint: "可以只看菜單；若要用餐，依自己的飲食需求和預算選擇。" },
      { id: "cabin-snack", title: "去小木屋找一份散步補給", kind: "補給任務", minutes: 40, moods: ["curious"], place: "indoor", desc: "認識小木屋的餐點或飲品，選一樣適合帶著繼續探索校園的補給。", hint: "先看看菜單和營業狀況；不想消費也可以先記住位置。" },
      { id: "matty-break", title: "在馬提咖啡廳安排一段休息", kind: "咖啡廳探索", minutes: 40, moods: ["quiet", "curious"], place: "indoor", desc: "看看馬提咖啡廳的空間和品項，替自己挑一個下次想休息的角落。", hint: "不必消費；若要點餐，先確認當日營業與價格。" },

      { id: "school-motto", title: "用一個小行動實踐勤勞樸實", kind: "校訓小挑戰", minutes: 20, moods: ["quiet", "move", "curious"], place: "any", desc: "選一件當下做得到的小事：主動帶路、把公共空間留整齊，或認真走完一段新路線。", hint: "想想勤勞與樸實對你的意思，挑一個今天就能做到的行動。" }
    ];
    const moodLabels = { quiet: "適合慢慢來", move: "讓身體動一動", curious: "留心新鮮事" };
    const placeLabels = { outdoor: "戶外", indoor: "室內", any: "室內外皆可" };
    const storageKey = "cgu-campus-adventure-favorites-v1";
    let currentIdea = null;
    let previousId = null;
    let favorites = loadFavorites();

    const byId = (id) => ideas.find((idea) => idea.id === id);
    function loadFavorites() {
      try {
        const stored = JSON.parse(localStorage.getItem(storageKey) || "[]");
        return Array.isArray(stored) ? stored.filter((id) => ideas.some((idea) => idea.id === id)) : [];
      } catch { return []; }
    }
    function persistFavorites() {
      try { localStorage.setItem(storageKey, JSON.stringify(favorites)); }
      catch { setStatus("瀏覽器目前無法儲存收藏；這次瀏覽期間仍可使用。"); }
    }
    function selected(name) { return document.querySelector(`input[name="${name}"]:checked`).value; }
    function setStatus(message) { document.getElementById("status").textContent = message; }
    function renderIdea(idea) {
      currentIdea = idea;
      document.getElementById("empty-state").hidden = true;
      document.getElementById("activity").hidden = false;
      document.getElementById("activity-time").textContent = `${idea.minutes} 分鐘`;
      document.getElementById("activity-place").textContent = placeLabels[idea.place];
      document.getElementById("activity-mood").textContent = idea.kind;
      document.getElementById("activity-title").textContent = idea.title;
      document.getElementById("activity-desc").textContent = idea.desc;
      document.getElementById("activity-hint").textContent = idea.hint;
      document.getElementById("save").textContent = favorites.includes(idea.id) ? "♥ 已收藏" : "♡ 收藏";
      setStatus(`抽到「${idea.title}」，${idea.minutes} 分鐘可以完成。`);
    }
    function drawIdea() {
      const maxTime = Number(selected("time"));
      const mood = selected("mood");
      const place = selected("place");
      const matches = ideas.filter((idea) => idea.minutes <= maxTime && idea.moods.includes(mood) && (place === "any" || idea.place === place || idea.place === "any"));
      if (!matches.length) {
        setStatus("這組條件暫時沒有點子，試試選「都可以」或增加一點時間。");
        return;
      }
      const options = matches.length > 1 ? matches.filter((idea) => idea.id !== previousId) : matches;
      const chosen = options[Math.floor(Math.random() * options.length)];
      previousId = chosen.id;
      renderIdea(chosen);
    }
    function renderFavorites() {
      const list = document.getElementById("saved-list");
      const savedIdeas = favorites.map(byId).filter(Boolean);
      document.getElementById("saved-count").textContent = `${savedIdeas.length} 個收藏`;
      list.replaceChildren();
      if (!savedIdeas.length) {
        const empty = document.createElement("p");
        empty.className = "saved-empty";
        empty.textContent = "喜歡的點子會收在這裡。";
        list.append(empty);
        return;
      }
      savedIdeas.forEach((idea) => {
        const row = document.createElement("div");
        row.className = "saved-item";
        const title = document.createElement("span");
        title.textContent = idea.title;
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "移除";
        remove.setAttribute("aria-label", `移除收藏：${idea.title}`);
        remove.addEventListener("click", () => toggleFavorite(idea));
        row.append(title, remove);
        list.append(row);
      });
    }
    function toggleFavorite(idea) {
      if (favorites.includes(idea.id)) {
        favorites = favorites.filter((id) => id !== idea.id);
        setStatus(`已從口袋清單移除「${idea.title}」。`);
      } else {
        favorites.push(idea.id);
        setStatus(`已收藏「${idea.title}」。`);
      }
      persistFavorites();
      renderFavorites();
      if (currentIdea) document.getElementById("save").textContent = favorites.includes(currentIdea.id) ? "♥ 已收藏" : "♡ 收藏";
    }

    document.getElementById("draw").addEventListener("click", drawIdea);
    document.getElementById("reroll").addEventListener("click", drawIdea);
    document.getElementById("save").addEventListener("click", () => { if (currentIdea) toggleFavorite(currentIdea); });
    document.getElementById("copy").addEventListener("click", async () => {
      if (!currentIdea) return;
      const text = `${currentIdea.title}\n${currentIdea.desc}\n現在開始：${currentIdea.hint}`;
      try {
        await navigator.clipboard.writeText(text);
        setStatus("活動點子已複製，可以分享或留給自己。");
      } catch {
        setStatus("無法存取剪貼簿；請手動選取活動內容複製。 ");
      }
    });
    renderFavorites();
  </script>
</body>
</html>
